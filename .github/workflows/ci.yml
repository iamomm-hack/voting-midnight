name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Compile, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
          cache: npm

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: 0.31.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Compact contract
        run: npm run compact --workspace=@midnight-ntwrk/voting-contract

      - name: Type-check Compact bindings and tests
        run: npm run typecheck --workspace=@midnight-ntwrk/voting-contract

      - name: Build Compact contract package
        run: npm run build --workspace=@midnight-ntwrk/voting-contract

      - name: Run Compact contract tests
        run: npm test

      - name: Check API package
        run: npm run ci --workspace=@midnight-ntwrk/voting-api

      - name: Check CLI package
        run: npm run ci --workspace=@midnight-ntwrk/voting-cli

      - name: Check UI package
        run: npm run ci --workspace=@midnight-ntwrk/voting-ui

      - name: Build production application
        run: npm run build --workspace=@midnight-ntwrk/voting-ui

      - name: Upload production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: voting-ui/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
