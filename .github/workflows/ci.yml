# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Compile, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          cache: npm

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: 0.31.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Compact contract
        run: npm run compact --workspace=@midnight-ntwrk/voting-contract

      - name: Type-check Compact bindings and tests
        run: npm run typecheck --workspace=@midnight-ntwrk/voting-contract

      - name: Build Compact contract package
        run: npm run build --workspace=@midnight-ntwrk/voting-contract

      - name: Run Compact contract tests
        run: npm run test:ci --workspace=@midnight-ntwrk/voting-contract

      - name: Check API package
        run: npm run ci --workspace=@midnight-ntwrk/voting-api

      - name: Check CLI package
        run: npm run ci --workspace=@midnight-ntwrk/voting-cli

      - name: Check UI package
        run: npm run ci --workspace=@midnight-ntwrk/voting-ui

      - name: Build production application
        run: npm run build --workspace=@midnight-ntwrk/voting-ui

      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: voting-ui-production
          path: voting-ui/dist
